---
- name: Configure Arch workstation
  hosts: localhost
  connection: local
  gather_facts: true
  vars_files:
    - ../.chezmoidata/packages.yaml
    - ../.chezmoidata/machines.yaml
  vars:
    ansible_python_interpreter: /usr/bin/python
    workstation_user: "{{ ansible_facts['user_id'] }}"
    workstation_home: "{{ ansible_facts['user_dir'] }}"
    hostname: "{{ ansible_facts['hostname'] }}"
    profile: "{{ machines[hostname] }}"
    system_services:
      - NetworkManager.service
      - greetd.service
      - opensnitchd.service
      - docker.service

  pre_tasks:
    - name: Verify Arch and regular user
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'Archlinux'
          - ansible_facts['user_uid'] != 0
          - hostname in machines
        fail_msg: Run as your regular user on Arch with hostname molly, funkypunk or badapple.

    - name: Show machine profile
      ansible.builtin.debug:
        msg: "{{ hostname }}: {{ profile.type }}, {{ profile.gpu }}, gaming={{ profile.gaming }}"

    - name: Verify Dell profile matches the hardware
      ansible.builtin.assert:
        that:
          - "'G15 5530' in ansible_facts.get('product_name', '')"
        fail_msg: The funkypunk hardware profile is intended for the Dell G15 5530.
      when: profile.dell_awcc | default(false)

    - name: Detect installed kernels for NVIDIA DKMS
      ansible.builtin.command:
        argv: [pacman, -Qq, linux, linux-lts, linux-zen, linux-hardened]
      register: installed_kernels
      changed_when: false
      failed_when: false
      check_mode: false
      when: profile.gpu == 'nvidia_hybrid'

    - name: Check competing Dell profile managers
      ansible.builtin.command:
        argv: [systemctl, show, --property=ActiveState, --property=UnitFileState, --value, "{{ item }}"]
      loop:
        - power-profiles-daemon.service
        - tlp.service
        - tuned.service
      register: competing_profile_managers
      changed_when: false
      failed_when: false
      check_mode: false
      when: profile.dell_awcc | default(false)

    - name: Require one Dell thermal profile manager
      ansible.builtin.assert:
        that:
          - "item.stdout_lines | intersect(['active', 'activating', 'enabled', 'enabled-runtime']) | length == 0"
        fail_msg: "{{ item.item }} is active/enabled. Choose AWCC or that profile manager before provisioning."
      loop: "{{ competing_profile_managers.results | default([]) }}"
      when: profile.dell_awcc | default(false)

    - name: Require a supported kernel for NVIDIA DKMS
      ansible.builtin.assert:
        that: installed_kernels.stdout_lines | length > 0
        fail_msg: The Dell profile requires linux, linux-lts, linux-zen or linux-hardened.
      when: profile.gpu == 'nvidia_hybrid'

    - name: Build official package list
      ansible.builtin.set_fact:
        official_packages: >-
          {{ (packages.official.common + packages.official[hostname]
              + (packages.official.gaming if profile.gaming else [])
              + ((installed_kernels.stdout_lines | map('regex_replace', '$', '-headers') | list)
                 if profile.gpu == 'nvidia_hybrid' else [])) | unique | list }}

  tasks:
    - name: Enable multilib
      become: true
      ansible.builtin.replace:
        path: /etc/pacman.conf
        regexp: '^#\[multilib\]\n#Include = /etc/pacman.d/mirrorlist'
        replace: "[multilib]\nInclude = /etc/pacman.d/mirrorlist"
        backup: true

    - name: Refresh repositories and upgrade system
      become: true
      community.general.pacman:
        update_cache: true
        upgrade: true

    - name: Install official packages
      become: true
      community.general.pacman:
        name: "{{ official_packages }}"
        state: present

    # Pristine check mode cannot configure files/units/groups from packages
    # which have only been predicted, not installed. No repair migrations.
    - name: Configure installed system
      when: not ansible_check_mode
      block:
        - name: Configure greetd
          become: true
          ansible.builtin.copy:
            dest: /etc/greetd/config.toml
            owner: root
            group: root
            mode: "0644"
            backup: true
            content: |
              [terminal]
              vt = 1

              [default_session]
              command = "tuigreet --time --remember --cmd 'uwsm start sway.desktop'"
              user = "greeter"

        - name: Enable system services for next boot
          become: true
          ansible.builtin.systemd_service:
            name: "{{ item }}"
            enabled: true
          loop: "{{ system_services }}"

        - name: Add user to docker group
          become: true
          ansible.builtin.user:
            name: "{{ workstation_user }}"
            groups: docker
            append: true

        - name: Enable Dell Bluetooth for next boot
          become: true
          ansible.builtin.systemd_service:
            name: bluetooth.service
            enabled: true
          when: profile.dell_awcc | default(false)

        - name: Load Dell control module on subsequent boots
          become: true
          ansible.builtin.copy:
            dest: /etc/modules-load.d/dell-awcc.conf
            owner: root
            group: root
            mode: "0644"
            content: "acpi_call\n"
          when: profile.dell_awcc | default(false)

        - name: Create Syncthing user service directory
          ansible.builtin.file:
            path: "{{ workstation_home }}/.config/systemd/user/default.target.wants"
            state: directory
            mode: "0755"

        - name: Enable Syncthing for next user session
          ansible.builtin.file:
            src: /usr/lib/systemd/user/syncthing.service
            dest: "{{ workstation_home }}/.config/systemd/user/default.target.wants/syncthing.service"
            state: link

        - name: Verify official packages
          ansible.builtin.command:
            argv: "{{ ['pacman', '-Q'] + official_packages }}"
          changed_when: false

        - name: Verify enabled system services
          ansible.builtin.command:
            argv: [systemctl, is-enabled, "{{ item }}"]
          changed_when: false
          loop: "{{ system_services }}"
